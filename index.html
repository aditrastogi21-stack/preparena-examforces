function aiSolverMessageHTML(m, idx){
  let body = '';
  if(m.status==='loading'){
    body = `<div class="card text-sm text-muted">🤔 Working through it carefully…</div>`;
  } else if(m.status==='error'){
    body = `<div class="card" style="background:#FCEBEB;color:#A32D2D">⚠️ ${escapeHtml(m.error||'Something went wrong.')} <button class="btn btn-sm mt-1" onclick="aiSolverRetry(${idx})">Retry</button></div>`;
  } else if(m.status==='done'){
    const total = m.steps.length;
    const isTheory = m.questionType === 'theoretical';
    const checkBox = isTheory ? `
      <div class="card mb-1" style="background:var(--color-background-secondary)">
        <div class="text-xs text-muted">💭 This is a concept question — try explaining it in your own words first, then reveal the steps below to check your understanding and fill any gaps.</div>
      </div>` : `
      <div class="card mb-1" style="background:var(--color-background-secondary)">
        <div class="text-xs text-muted mb-1">Want to test yourself first? Type your answer and check it:</div>
        <div class="flex gap-sm">
          <input id="ai-check-${idx}" type="text" placeholder="Your answer..." style="flex:1;font-size:13px;padding:6px 8px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;background:var(--color-background-primary);color:var(--color-text-primary)" onkeydown="if(event.key==='Enter')aiSolverCheckAnswer(${idx})" />
          <button class="btn btn-sm" onclick="aiSolverCheckAnswer(${idx})">Check</button>
        </div>
        ${m.checkResult?`<div class="text-xs mt-1" style="color:${m.checkResult==='correct'?'#085041':'#A32D2D'}">${m.checkResult==='correct'?'✅ Looks right — nice work!':'❌ Not quite — reveal a step below for a hint.'}</div>`:''}
      </div>`;
    let stepsHTML = '';
    for(let i=0;i<m.unlockedCount;i++){
      const isLast = i===total-1;
      stepsHTML += `
      <div class="card mb-1" style="${isLast?'border-color:#1D9E75;background:#E1F5EE':''}">
        <span class="tag mb-1" style="${isLast?'background:#1D9E75;color:#fff':'background:#EEEDFE;color:#3C3489'}">${isLast?'✅ ':''}${escapeHtml(m.steps[i].title)}</span>
        <div class="text-sm" style="line-height:1.6;margin-top:6px">${escapeHtml(m.steps[i].content)}</div>
      </div>`;
    }
    if(m.unlockedCount<total){
      stepsHTML += `<button class="btn btn-sm mb-1" onclick="aiSolverRevealNext(${idx})"><i class="ti ti-lock-open" aria-hidden="true"></i> Reveal Step ${m.unlockedCount+1} of ${total}</button>`;
    } else {
      stepsHTML += `<div class="card mb-1" style="background:#534AB7;color:#fff"><div class="text-xs mb-1" style="opacity:.85">${isTheory?'💡 Key Takeaway':'✅ Final Answer'}</div><div style="font-size:14px;font-weight:500">${escapeHtml(m.final_answer)}</div></div>`;
    }
    body = checkBox + stepsHTML;
  }
  const typeTag = m.questionType ? `<span class="tag" style="${m.questionType==='theoretical'?'background:#FAEEDA;color:#854F0B':'background:#E1F5EE;color:#085041'};margin-left:6px">${m.questionType==='theoretical'?'🧠 Concept doubt':'🧮 Numerical / problem'}</span>` : '';
  return `
  <div class="mb-2">
    <div class="card mb-1" style="background:#EEEDFE">
      <div class="text-xs text-muted mb-1">${m.topic?escapeHtml(m.topic)+' · ':''}Your question${typeTag}</div>
      ${m.imageBase64?`<img src="data:${m.imageMime};base64,${m.imageBase64}" style="max-width:100%;max-height:220px;border-radius:8px;margin-bottom:6px;display:block" />`:''}
      ${m.question?`<div style="font-size:14px">${escapeHtml(m.question)}</div>`:''}
    </div>
    ${body}
  </div>`;
}

function aiSolverAttachImage(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    const result = reader.result;
    const match = /^data:(.+);base64,(.*)$/.exec(result);
    if(match){
      state.aiSolver.imageMime = match[1];
      state.aiSolver.imageBase64 = match[2];
      const thumb = document.getElementById('ai-solver-image-thumb');
      const preview = document.getElementById('ai-solver-image-preview');
      if(thumb) thumb.src = result;
      if(preview) preview.style.display='block';
    }
  };
  reader.readAsDataURL(file);
}

function aiSolverRemoveImage(){
  state.aiSolver.imageBase64 = null;
  state.aiSolver.imageMime = null;
  const preview = document.getElementById('ai-solver-image-preview');
  if(preview) preview.style.display='none';
}

async function aiSolverCallAPI(questionText, imageBase64, imageMime){
  const contentBlocks = [];
  if(imageBase64){
    contentBlocks.push({type:'image', source:{type:'base64', media_type: imageMime||'image/png', data: imageBase64}});
  }
  contentBlocks.push({type:'text', text: questionText || 'Solve the question shown in the attached image, step by step.'});
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      system: AI_SOLVER_SYSTEM_PROMPT,
      messages:[{role:'user', content: contentBlocks}]
    })
  });
  if(!res.ok){ throw new Error('The solver API returned an error ('+res.status+'). Please try again.'); }
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.text||'').join('\n');
  const clean = text.replace(/```json|```/g,'').trim();
  let parsed;
  try{ parsed = JSON.parse(clean); }
  catch(e){
    const m = clean.match(/\{[\s\S]*\}/);
    if(m){ parsed = JSON.parse(m[0]); }
    else { throw new Error('Could not parse a solution. Please try rephrasing your question.'); }
  }
  if(!parsed.steps || !parsed.steps.length){ throw new Error('No steps were returned. Please try again.'); }
  return parsed;
}

async function aiSolverSolve(){
  const textEl = document.getElementById('ai-solver-input');
  const question = (textEl.value||'').trim();
  const imageBase64 = state.aiSolver.imageBase64;
  const imageMime = state.aiSolver.imageMime;
  if(!question && !imageBase64) return;
  const msg = {question, imageBase64, imageMime, status:'loading', steps:[], unlockedCount:1, final_answer:'', topic:'', questionType:null, checkResult:null, error:null};
  state.aiSolver.messages.push(msg);
  const idx = state.aiSolver.messages.length-1;
  textEl.value='';
  aiSolverRemoveImage();
  render();
  await aiSolverRunQuery(idx);
}

async function aiSolverRunQuery(idx){
  const msg = state.aiSolver.messages[idx];
  try{
    const result = await aiSolverCallAPI(msg.question, msg.imageBase64, msg.imageMime);
    msg.topic = result.topic||'';
    msg.questionType = result.question_type==='theoretical' ? 'theoretical' : 'numerical';
    msg.final_answer = result.final_answer||'';
    msg.steps = result.steps.slice(0,6);
    msg.unlockedCount = 1;
    msg.status = 'done';
  } catch(err){
    msg.status = 'error';
    msg.error = (err && err.message) || 'Something went wrong while solving this.';
  }
  render();
}

function aiSolverRetry(idx){
  const msg = state.aiSolver.messages[idx];
  msg.status = 'loading';
  msg.error = null;
  render();
  aiSolverRunQuery(idx);
}

function aiSolverRevealNext(idx){
  const msg = state.aiSolver.messages[idx];
  if(msg.unlockedCount < msg.steps.length) msg.unlockedCount++;
  render();
}

function aiSolverFuzzyNumMatch(a,b){
  const numsA = a.match(/[\d.]+/g)||[];
  const numsB = b.match(/[\d.]+/g)||[];
  if(numsA.length && numsB.length) return numsA.some(x=>numsB.includes(x));
  return false;
}

function aiSolverCheckAnswer(idx){
  const input = document.getElementById('ai-check-'+idx);
  if(!input) return;
  const val = (input.value||'').trim().toLowerCase();
  if(!val) return;
  const msg = state.aiSolver.messages[idx];
  const target = (msg.final_answer||'').toLowerCase();
  const correct = !!target && (target.includes(val) || val.includes(target) || aiSolverFuzzyNumMatch(val,target));
  msg.checkResult = correct?'correct':'incorrect';
  render();
}

    <div class="card" style="text-align:center">
      <div style="font-size:40px;margin-bottom:8px">${score>=5?'🏆':score>=3?'⭐':'📖'}</div>
      <div style="font-size:18px;font-weight:500;margin-bottom:4px">${score>=5?'Topic Mastered!':score>=3?'Good Progress!':'Keep Practising!'}</div>
      <div class="text-sm text-muted mb-1">${score}/5 questions correct</div>
      <span class="tag" style="${khMasteryTagStyle(t.id)};font-size:14px;padding:6px 18px">${mc==='red'?'🔴 Learning — review again':mc==='yellow'?'🟡 Practising — getting there!':mc==='green'?'🟢 Mastered — excellent!':'Keep going'}</span>
      <div class="mt-1 flex gap-sm" style="justify-content:center;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="khStartQuiz()">Retry Quiz</button>
        <button class="btn btn-sm" onclick="khOpenChapter('${state.km.subjectId}','${ch.id}')">Back to Topics</button>
        <button class="btn btn-primary btn-sm" onclick="khOpenMorePicker()">Not satisfied? More Questions</button>
      </div>
    </div>`;
  }
  const q=qs[qi];
  const ans=state.km.quizAnswered;
  const diffLabels=['Very Easy','Easy','Medium','Hard','Advanced'];
  const tagColors=[['#FCEBEB','#A32D2D'],['#FAECE7','#993C1D'],['#FAEEDA','#854F0B'],['#E1F5EE','#3B6D11'],['#EAF3DE','#085041']];
  return `
  <div class="breadcrumb"><span onclick="khOpenTopic('${state.km.subjectId}','${ch.id}','${t.id}')">← ${t.name}</span> › Quiz</div>
  <div class="card">
    <div class="flex mb-1" style="justify-content:space-between">
      <span class="tag" style="background:${tagColors[qi][0]};color:${tagColors[qi][1]}">Q${qi+1} of 5 — ${diffLabels[qi]}</span>
    </div>
    <div class="q-text">${q.q}</div>
    ${q.opts.map((o,i)=>`
      <div class="opt ${ans!==null?(i===q.ans?'correct':(ans===i?'wrong':'')):''}" onclick="${ans===null?`khAnswerQ(${i})`:''}">
        <div class="opt-label">${String.fromCharCode(65+i)}</div>${o}
      </div>`).join('')}
    ${ans!==null?`<div style="font-size:12px;padding:8px 10px;background:var(--color-background-secondary);border-radius:6px;color:var(--color-text-secondary);margin-top:8px">💡 ${q.exp}</div>
    <div class="mt-1" style="text-align:right"><button class="btn btn-primary btn-sm" onclick="khNextQ()">Next Question <i class="ti ti-arrow-right" aria-hidden="true"></i></button></div>`:''}
  </div>`;
}

function khMoreHTML(){
  const s=CURRICULUM[state.km.subjectId];
  const ch=s.chapters.find(c=>c.id===state.km.chapterId);
  const t=ch.topics.find(x=>x.id===state.km.topicId);
  if(!state.km.moreDifficulty){
    return `
    <div class="breadcrumb"><span onclick="khOpenTopic('${state.km.subjectId}','${ch.id}','${t.id}')">← ${t.name}</span> › More Questions</div>
    <p class="section-title">Pick a difficulty for extra practice on "${t.name}":</p>
    <div class="grid-3">
      <div class="card km-choice" onclick="khSelectMoreDifficulty('easy')">
        <div style="font-size:28px;margin-bottom:6px">🟢</div>
        <div style="font-size:14px;font-weight:500">Easy</div>
        <div class="text-xs text-muted">Warm up with the basics</div>
      </div>
      <div class="card km-choice" onclick="khSelectMoreDifficulty('medium')">
        <div style="font-size:28px;margin-bottom:6px">🟡</div>
        <div style="font-size:14px;font-weight:500">Medium</div>
        <div class="text-xs text-muted">Apply the concept</div>
      </div>
      <div class="card km-choice" onclick="khSelectMoreDifficulty('hard')">
        <div style="font-size:28px;margin-bottom:6px">🔴</div>
        <div style="font-size:14px;font-weight:500">Hard</div>
        <div class="text-xs text-muted">JEE Advanced level challenge</div>
      </div>
    </div>`;
  }
  const pool = (EXTRA_QUESTIONS[t.id]&&EXTRA_QUESTIONS[t.id][state.km.moreDifficulty])||[];
  const q = pool[0];
  const labelMap={easy:'🟢 Easy',medium:'🟡 Medium',hard:'🔴 Hard'};
  if(!q){
    return `
    <div class="breadcrumb"><span onclick="khBackToMorePicker()">← Choose Difficulty</span> › More Questions</div>
    <div class="card" style="text-align:center">
      <div class="text-sm text-muted mb-1">More ${labelMap[state.km.moreDifficulty]} questions for this topic are coming soon!</div>
      <button class="btn btn-sm" onclick="khBackToMorePicker()">Try Another Difficulty</button>
    </div>`;
  }
  const ans = state.km.moreAnswered;
  return `
  <div class="breadcrumb"><span onclick="khBackToMorePicker()">← Choose Difficulty</span> › ${labelMap[state.km.moreDifficulty]} Practice</div>
  <div class="card">
    <div class="q-text">${q.q}</div>
    ${q.opts.map((o,i)=>`
      <div class="opt ${ans!==null?(i===q.ans?'correct':(ans===i?'wrong':'')):''}" onclick="${ans===null?`khAnswerMore(${i})`:''}">
        <div class="opt-label">${String.fromCharCode(65+i)}</div>${o}
      </div>`).join('')}
    ${ans!==null?`<div style="font-size:12px;padding:8px 10px;background:var(--color-background-secondary);border-radius:6px;color:var(--color-text-secondary);margin-top:8px">💡 ${q.exp}</div>
    <div class="mt-1 flex gap-sm" style="justify-content:center">
      <button class="btn btn-sm" onclick="khBackToMorePicker()">Try Another Difficulty</button>
      <button class="btn btn-primary btn-sm" onclick="khOpenTopic('${state.km.subjectId}','${ch.id}','${t.id}')">Back to Topic</button>
    </div>`:''}
  </div>`;
}


// ── Knowledge Hub helper functions ──
function khOverallStats(){
  let done=0,total=0;
  Object.values(CURRICULUM).forEach(s=>s.chapters.forEach(ch=>ch.topics.forEach(t=>{
    total++;
    if((mastery[t.id]||0)>=5) done++;
  })));
  return {done,total};
}

function khGetMastery(topicId){
  const m=mastery[topicId]||0;
  if(m===0) return 'none';
  if(m<3) return 'red';
  if(m<5) return 'yellow';
  return 'green';
}

function khMasteryDotColor(topicId){
  const m=khGetMastery(topicId);
  if(m==='none') return 'var(--bg2)';
  if(m==='red') return 'var(--red)';
  if(m==='yellow') return 'var(--amber)';
  return 'var(--green)';
}

function khMasteryLabel(topicId){
  const m=khGetMastery(topicId);
  if(m==='none') return 'Not started';
  if(m==='red') return '🔴 Learning';
  if(m==='yellow') return '🟡 Practising';
  return '🟢 Mastered';
}

function khMasteryTagStyle(topicId){
  const m=khGetMastery(topicId);
  if(m==='none') return 'background:var(--bg2);color:var(--muted)';
  if(m==='red') return 'background:var(--red-light);color:#A32D2D';
  if(m==='yellow') return 'background:var(--amber-light);color:#854F0B';
  return 'background:var(--green-light);color:#085041';
}

function khCurrentTopic(){
  const s=CURRICULUM[state.km.subjectId];
  const ch=s.chapters.find(c=>c.id===state.km.chapterId);
  return ch.topics.find(t=>t.id===state.km.topicId);
}

function khGoHome(){ state.km={view:'home',subjectId:null,chapterId:null,topicId:null,learnMode:null,quizIdx:0,quizAnswers:{},quizAnswered:null,moreDifficulty:null,moreAnswered:null}; render(); }
function khOpenSubject(id){ state.km.view='subject'; state.km.subjectId=id; state.km.chapterId=null; state.km.topicId=null; render(); }
function khOpenChapter(sId,cId){ state.km.view='chapter'; state.km.subjectId=sId; state.km.chapterId=cId; state.km.topicId=null; render(); }
function khOpenTopic(sId,cId,tId){ state.km.view='topic'; state.km.subjectId=sId; state.km.chapterId=cId; state.km.topicId=tId; state.km.learnMode=null; render(); }
function khStartLearn(mode){ state.km.view='learn'; state.km.learnMode=mode; render(); }
function khStartQuiz(){ state.km.view='quiz'; state.km.quizIdx=0; state.km.quizAnswers={}; state.km.quizAnswered=null; render(); }
function khAnswerQ(i){
  const t=khCurrentTopic();
  const q=t.questions[state.km.quizIdx];
  const correct=i===q.ans;
  state.km.quizAnswers[state.km.quizIdx]=correct;
  state.km.quizAnswered=i;
  if(correct){const cur=mastery[t.id]||0; if(cur<=state.km.quizIdx) mastery[t.id]=state.km.quizIdx+1;}
  render();
}
function khNextQ(){ state.km.quizIdx++; state.km.quizAnswered=null; render(); }
function khOpenMorePicker(){ state.km.view='more'; state.km.moreDifficulty=null; state.km.moreAnswered=null; render(); }
function khSelectMoreDifficulty(d){ state.km.moreDifficulty=d; state.km.moreAnswered=null; render(); }
function khAnswerMore(i){ state.km.moreAnswered=i; render(); }
function khBackToMorePicker(){ state.km.moreDifficulty=null; state.km.moreAnswered=null; render(); }


nav('dashboard');
</script>
</body>
</html>
