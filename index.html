<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--bg2:#F2F1ED;--bg3:#F7F6F2;
  --border:#E7E5DE;--border2:#D8D6CF;
  --text:#1C1B19;--muted:#73716A;
  --accent:#534AB7;--accent-light:#EEEDFE;
  --green:#1D9E75;--green-light:#E1F5EE;
  --amber:#BA7517;--amber-light:#FAEEDA;
  --red:#E24B4A;--red-light:#FCEBEB;
  --orange:#993C1D;--orange-light:#FAECE7;
  --font:'Inter',sans-serif;--mono:'Roboto Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg3);color:var(--text);font-size:15px;line-height:1.6}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:220px;min-width:220px;background:var(--bg);border-right:0.5px solid var(--border);padding:1rem 0;display:flex;flex-direction:column;gap:2px}
.logo{padding:0 1rem 1rem;border-bottom:0.5px solid var(--border);margin-bottom:0.5rem}
.logo h1{font-size:18px;font-weight:600}
.logo span{font-size:11px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 1rem;cursor:pointer;color:var(--muted);font-size:13px;border-left:2px solid transparent;transition:all .12s}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{color:var(--accent);background:var(--accent-light);border-left-color:var(--accent);font-weight:500}
.nav-item i{font-size:16px}
.main{flex:1;overflow:auto}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-title{font-size:17px;font-weight:500}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:12px;color:var(--accent)}
.rating-chip{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:500}
.content{padding:1.5rem}

/* CARDS + LAYOUT */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row{display:flex;gap:1rem}
.flex{display:flex;align-items:center}
.gap6{gap:6px}
.mb1{margin-bottom:.75rem}
.mb2{margin-bottom:1.25rem}
.mt1{margin-top:.75rem}
.sec{font-size:14px;font-weight:500;margin-bottom:.75rem}
.muted{color:var(--muted)}
.xs{font-size:12px}
.sm{font-size:13px}

/* STATS */
.stat{background:var(--bg2);border-radius:10px;padding:.85rem 1rem}
.stat-l{font-size:11px;color:var(--muted);margin-bottom:3px}
.stat-v{font-size:22px;font-weight:500}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:transparent;color:var(--text);transition:all .12s;font-family:var(--font)}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:hover{background:#3C3489}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}

/* TAGS / PILLS */
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--muted)}
.div1{background:var(--orange-light);color:var(--orange)}
.div2{background:var(--amber-light);color:var(--amber)}
.div3{background:var(--accent-light);color:var(--accent)}
.div4{background:var(--green-light);color:var(--green)}
.pill-hard{background:var(--orange-light);color:var(--orange);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.pill-medium{background:var(--amber-light);color:var(--amber);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.pill-easy{background:var(--green-light);color:var(--green);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}

/* CONTEST CARD */
.contest-card{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;cursor:pointer;transition:border-color .15s}
.contest-card:hover{border-color:var(--accent)}

/* MCQ OPTION */
.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:6px;transition:all .12s;background:var(--bg)}
.opt:hover:not(.correct):not(.wrong):not(.answered){border-color:var(--accent);background:var(--accent-light)}
.opt.correct{border-color:var(--green);background:var(--green-light);color:#085041}
.opt.wrong{border-color:var(--red);background:var(--red-light);color:#501313}
.opt.answered{cursor:default}
.opt-lbl{width:22px;height:22px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}

/* PROGRESS BAR */
.pbar-wrap{height:5px;background:var(--bg2);border-radius:3px}
.pbar{height:5px;border-radius:3px;background:var(--accent)}

/* QOTD */
.qotd-tab{padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:0.5px solid var(--border);background:transparent;color:var(--muted)}
.qotd-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* BREADCRUMB */
.bc{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-bottom:1rem;flex-wrap:wrap}
.bc span{cursor:pointer;color:var(--accent)}
.bc span:hover{text-decoration:underline}

/* LEADERBOARD */
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.lb-row:last-child{border-bottom:none}
.lb-rank{width:28px;text-align:center;font-size:13px;font-weight:500;color:var(--muted)}

/* MASTERY DOTS */
.mdot{width:11px;height:11px;border-radius:50%;display:inline-block;flex-shrink:0}
.mdot-none{background:var(--bg2);border:1.5px solid var(--border2)}
.mdot-red{background:var(--red)}
.mdot-yellow{background:var(--amber)}
.mdot-green{background:var(--green)}

/* ===================== EXAM UI ===================== */
.exam-wrap{display:flex;height:calc(100vh - 56px);overflow:hidden;margin:-1.5rem}
.exam-left{width:260px;min-width:260px;background:var(--bg);border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.exam-left-head{background:var(--accent);padding:1rem;color:#fff;flex-shrink:0}
.exam-timer-big{font-size:30px;font-weight:500;font-family:var(--mono);letter-spacing:2px}
.exam-qlist{flex:1;overflow-y:auto;padding:.75rem}
.exam-qrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;font-size:13px;border:0.5px solid transparent;transition:all .12s}
.exam-qrow:hover{background:var(--bg2)}
.exam-qrow.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:500}
.exam-qrow.done{background:var(--green-light);border-color:var(--green);color:#085041}
.exam-qrow.wrong-done{background:var(--red-light);border-color:var(--red)}
.exam-right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.exam-topbar{padding:.75rem 1.25rem;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);flex-shrink:0}
.exam-body{flex:1;overflow-y:auto;padding:1.25rem}
.exam-footer{padding:.75rem 1.25rem;border-top:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);flex-shrink:0}
.q-time-chip{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:20px;background:var(--amber-light);color:var(--amber);font-weight:500}
.cheat-bar{background:var(--orange-light);border-bottom:1px solid #D85A30;padding:7px 1.25rem;font-size:12px;color:var(--orange);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pts-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-light);color:var(--accent);font-weight:500}

/* ===================== ANALYSIS ===================== */
.analysis-wrap{padding:1.5rem}
.radar-bar{height:8px;border-radius:4px;background:var(--bg2);margin-bottom:3px}
.radar-fill{height:8px;border-radius:4px;transition:width .8s ease}
.topic-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;margin:3px;font-weight:500}

/* ===================== REVISION ===================== */
.rev-card{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;cursor:pointer;transition:border-color .12s;margin-bottom:8px}
.rev-card:hover{border-color:var(--accent)}
.formula-box{background:var(--bg2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;font-family:var(--mono);font-size:13px;margin:6px 0}
.derivation-block{background:var(--bg2);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;margin:6px 0}
.pyq-row{background:var(--bg);border:0.5px solid var(--border);border-radius:10px;padding:.85rem 1rem;margin-bottom:8px;transition:border-color .12s}
.pyq-ans-reveal{display:none;margin-top:10px;padding:10px 12px;background:var(--accent-light);border-radius:8px;font-size:13px;line-height:1.7;border-left:3px solid var(--accent)}
.key-concept{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:20px;background:var(--accent);color:#fff;margin:2px;font-weight:500}

/* ===================== MISC ===================== */
.km-choice{cursor:pointer;text-align:center;transition:all .12s;border:0.5px solid var(--border);border-radius:12px;padding:1rem;background:var(--bg)}
.km-choice:hover{border-color:var(--accent);background:var(--accent-light)}
.mastery-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}
.subject-card{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;cursor:pointer;transition:border-color .15s}
.subject-card:hover{border-color:var(--accent)}
.topic-card{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;cursor:pointer;margin-bottom:8px}
.topic-card:hover{border-color:var(--accent)}
.progress-bar-wrap{height:4px;background:var(--bg2);border-radius:2px;width:80px}
.progress-bar{height:4px;background:var(--accent);border-radius:2px}
.chapter-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border);cursor:pointer;font-size:14px}
.chapter-item:hover{color:var(--accent)}
.chapter-item:last-child{border-bottom:none}

/* CSS variable aliases for Knowledge Hub */
:root {
  --color-background-primary: var(--bg);
  --color-background-secondary: var(--bg2);
  --color-background-tertiary: var(--bg3);
  --color-border-secondary: var(--border2);
  --color-border-tertiary: var(--border);
  --color-text-primary: var(--text);
  --color-text-secondary: var(--muted);
}
/* Missing utility classes for Knowledge Hub */
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#3C3489}
.gap-sm{gap:6px}
.mb-1{margin-bottom:.75rem}
.mb-2{margin-bottom:1.25rem}
.mt-1{margin-top:.75rem}
.text-sm{font-size:13px}
.text-xs{font-size:12px}
.text-muted{color:var(--muted)}
.section-title{font-size:14px;font-weight:500;margin-bottom:.75rem}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-bottom:1rem;flex-wrap:wrap}
.breadcrumb span{cursor:pointer;color:var(--accent)}
.breadcrumb span:hover{text-decoration:underline}
.div-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:8px}
.level-1{background:#EAF3DE;color:#3B6D11}
.level-2{background:#FAEEDA;color:#854F0B}
.level-3{background:#FAECE7;color:#993C1D}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.subject-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.subject-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}
.chapter-list{padding:0}
.topic-title{font-size:14px;font-weight:500;margin-bottom:4px}
.topic-desc{font-size:12px;color:var(--muted)}
.q-text{font-size:15px;font-weight:500;margin-bottom:1rem;line-height:1.6}
.opt-label,.opt-lbl{width:22px;height:22px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.progress-bar-wrap{height:4px;background:var(--bg2);border-radius:2px;width:80px}
.progress-bar{height:4px;background:var(--accent);border-radius:2px}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <div class="logo"><h1>⚡ PrepArena</h1><span>JEE / NEET Platform</span></div>
  <div class="nav-item active" onclick="nav('dashboard')" id="nav-dashboard"><i class="ti ti-layout-dashboard"></i> Dashboard</div>
  <div class="nav-item" onclick="nav('contests')" id="nav-contests"><i class="ti ti-trophy"></i> Contests</div>
  <div class="nav-item" onclick="nav('revision')" id="nav-revision"><i class="ti ti-notebook"></i> Revision</div>
  <div class="nav-item" onclick="nav('knowledgehub')" id="nav-knowledgehub"><i class="ti ti-atom"></i> Knowledge Hub</div>
  <div class="nav-item" onclick="nav('aisolver')" id="nav-aisolver"><i class="ti ti-message-chatbot"></i> AI Solver</div>
  <div class="nav-item" onclick="nav('qotd')" id="nav-qotd"><i class="ti ti-bulb"></i> Daily Questions</div>
  <div class="nav-item" onclick="nav('leaderboard')" id="nav-leaderboard"><i class="ti ti-chart-bar"></i> Leaderboard</div>
  <div class="nav-item" onclick="nav('profile')" id="nav-profile"><i class="ti ti-user"></i> My Profile</div>
</div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="page-title">Dashboard</div>
    <div class="user-chip">
      <span class="rating-chip" id="rating-chip" style="background:var(--accent-light);color:var(--accent)">⭐ 1000</span>
      <div class="avatar">AD</div>
      <span style="font-size:13px;font-weight:500">Adit</span>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
</div>

<script>
// =========================================================
// CONSTANTS & DATA
// =========================================================
const RATING_CONFIG = {
  base: 1000,
  div1_min: 1200,
  div2_min: 1100,
  div3_min: 0,
  div4_min: 0,
};

const CONTESTS = [
  {id:'c1',name:'Weekly Sprint I',div:'Div 4',cls:'div4',date:'Sat, 28 Jun 2025',time:'6:00 PM',dur:90,minR:0,qs:[
    {id:'A',diff:'Easy',  topic:'Kinematics',  pts:500, q:'A ball thrown upward at 20 m/s. Time to reach max height (g=10 m/s²):', opts:['1 s','2 s','4 s','0.5 s'], ans:1, exp:'v=u−gt → 0=20−10t → t=2 s', key:['v=u+at','At max height v=0']},
    {id:'B',diff:'Easy',  topic:'Laws of Motion',pts:500, q:'A 5 kg block on frictionless surface, force 20N. Acceleration:', opts:['2 m/s²','4 m/s²','5 m/s²','10 m/s²'], ans:1, exp:'F=ma → a=F/m=20/5=4 m/s²', key:["Newton's 2nd Law","F=ma"]},
    {id:'C',diff:'Medium',topic:'Energy',pts:1000, q:'A 2 kg block moves at 3 m/s. Its kinetic energy is:', opts:['3 J','6 J','9 J','12 J'], ans:2, exp:'KE=½mv²=½×2×9=9 J', key:['KE=½mv²','Substitution']},
    {id:'D',diff:'Medium',topic:'Gravitation',pts:1000, q:'If Earth mass doubled (same radius), escape velocity becomes:', opts:['Same','√2 × 11.2 km/s','2 × 11.2 km/s','11.2/√2 km/s'], ans:1, exp:'v_e=√(2GM/R) ∝ √M. Double M → v_e×√2', key:['v_e=√(2GM/R)','Proportionality']},
    {id:'E',diff:'Hard',  topic:'Electrostatics',pts:1500, q:"Two +q charges at corners of equilateral triangle (side a). Force on third +q at apex:", opts:['kq²/a²','√3 kq²/a²','2kq²/a²','kq²/2a²'], ans:1, exp:'Each force = kq²/a² at 60° to each other. Resultant = √(F²+F²+2F²cos60°)=√3·F=√3kq²/a²', key:["Coulomb's Law","Superposition","Vector addition"]},
  ]},
  {id:'c2',name:'Challenger Round',div:'Div 2',cls:'div2',date:'Sun, 29 Jun 2025',time:'8:00 PM',dur:120,minR:1100,qs:[
    {id:'A',diff:'Easy',  topic:'Capacitors',pts:500, q:'Capacitance of parallel plate capacitor C=ε₀A/d. If d doubles:', opts:['C doubles','C halves','C unchanged','C quadruples'], ans:1, exp:'C∝1/d. Double d → C halves.', key:['C=ε₀A/d','Inverse relationship']},
    {id:'B',diff:'Medium',topic:'Current Electricity',pts:1000, q:'Wire of resistance R stretched to 2× length. New resistance:', opts:['R/2','2R','4R','R'], ans:2, exp:'Volume const → A halves. R=ρl/A → 4R', key:['R=ρl/A','Volume conservation']},
    {id:'C',diff:'Medium',topic:'Magnetism',pts:1000, q:'B inside ideal solenoid (n turns/m, current I):', opts:['μ₀I','μ₀nI','μ₀nI/2','2μ₀nI'], ans:1, exp:'B=μ₀nI by Ampere\'s law inside solenoid', key:["Ampere's Law",'Solenoid B=μ₀nI']},
    {id:'D',diff:'Hard',  topic:'Optics',pts:1500, q:'Convex lens f=10cm + concave lens f=20cm in contact. Combined f:', opts:['20 cm','10 cm','−20 cm','30 cm'], ans:0, exp:'P=P₁+P₂=10+(−5)=5D → f=20cm', key:['P=1/f','Lens combination P=P₁+P₂']},
    {id:'E',diff:'Hard',  topic:'Thermodynamics',pts:1500, q:'ΔH<0, ΔS<0. Reaction spontaneous when:', opts:['Always','Never','Low temperature','High temperature'], ans:2, exp:'ΔG=ΔH−TΔS. For ΔG<0 with both negative: need TΔS<ΔH → low T', key:['ΔG=ΔH−TΔS','Gibbs criterion']},
  ]},
  {id:'c3',name:'Foundations Cup',div:'Div 3',cls:'div3',date:'Sat, 5 Jul 2025',time:'5:00 PM',dur:90,minR:0,qs:[
    {id:'A',diff:'Easy',  topic:'Atomic Structure',pts:500, q:'Energy of electron in H atom 2nd orbit:', opts:['−13.6 eV','−3.4 eV','−1.51 eV','−0.85 eV'], ans:1, exp:'Eₙ=−13.6/n²=−13.6/4=−3.4 eV', key:['Bohr energy Eₙ=−13.6/n²']},
    {id:'B',diff:'Easy',  topic:'Periodic Table',pts:500, q:'Highest electronegativity element:', opts:['O','N','F','Cl'], ans:2, exp:'F has highest EN=4.0 on Pauling scale', key:['Pauling scale','F has max EN']},
    {id:'C',diff:'Medium',topic:'Integration',pts:1000, q:'∫₀³ x² dx =', opts:['3','9','27','81'], ans:1, exp:'[x³/3]₀³ = 27/3−0 = 9', key:['Power rule integration','Definite integral bounds']},
    {id:'D',diff:'Medium',topic:'Complex Numbers',pts:1000, q:'i⁴⁷ =', opts:['i','−i','1','−1'], ans:1, exp:'i⁴=1, 47=44+3, so i⁴⁷=i³=−i', key:['Powers of i cycle 4','i³=−i']},
    {id:'E',diff:'Hard',  topic:'SHM',pts:1500, q:'Spring-mass system k=100 N/m, m=0.25 kg. Angular frequency ω =', opts:['5 rad/s','10 rad/s','20 rad/s','40 rad/s'], ans:2, exp:'ω=√(k/m)=√(100/0.25)=√400=20 rad/s', key:['ω=√(k/m)','SHM formula']},
  ]},
  {id:'c4',name:'Elite Olympiad',div:'Div 1',cls:'div1',date:'Sun, 6 Jul 2025',time:'7:00 PM',dur:150,minR:1200,qs:[
    {id:'A',diff:'Medium',topic:"Gauss's Law",pts:750, q:'E inside hollow spherical shell (charge Q):', opts:['kQ/R²','kQ/r','Zero','σ/ε₀'], ans:2, exp:'No enclosed charge inside → E=0 by Gauss\'s law', key:["Gauss's Law",'Shell theorem','E=0 inside conductor']},

function enterContest(id){
  const c=CONTESTS.find(x=>x.id===id);
  if(!c) return;
  if(c.minR>userRating){
    alert(`This contest requires rating ≥ ${c.minR}.\nYour current rating: ${userRating}.\nKeep practising Div 3/4 to unlock this!`);
    return;
  }
  state.exam={
    contestId:id, activeQ:0,
    qStates: c.qs.map(q=>({...q,timeSpent:0,answered:false,selectedOpt:null,pts:0,timerRunning:false})),
    qTimerHandle:null, globalHandle:null,
    globalTimeLeft: c.dur*60,
    cheatCount:0, cheatPts:0,
    submitted:false,
    ratingBefore: userRating,
  };
  state.page='exam';
  document.getElementById('page-title').textContent=c.name+' · Live';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  render();
  startGlobalTimer();
  startQTimer(0);
  setupAntiCheat();
}

function switchQ(idx){
  if(idx===state.exam.activeQ) return;
  pauseQTimer();
  state.exam.activeQ=idx;
  render();
  startQTimer(idx);
}

function answerQ(optIdx){
  const ex=state.exam;
  const q=ex.qStates[ex.activeQ];
  if(q.answered) return;
  q.answered=true;
  q.selectedOpt=optIdx;
  const correct=optIdx===q.ans;
  if(correct){
    const timeBonus = Math.max(0, (q.diff==='Hard'?300:q.diff==='Medium'?200:100) - Math.floor(q.timeSpent/5)*15);
    q.pts = q.pts + timeBonus;
  } else { q.pts=0; }
  pauseQTimer();
  render();
  startQTimer(ex.activeQ);
  if(ex.activeQ<ex.qStates.length-1){
    setTimeout(()=>{ if(!ex.submitted) switchQ(ex.activeQ+1); },1200);
  }
}

let _qHandle=null, _gHandle=null;
function startQTimer(idx){
  const ex=state.exam;
  if(!ex||ex.submitted) return;
  clearInterval(_qHandle);
  _qHandle=setInterval(()=>{
    if(!ex||ex.submitted){clearInterval(_qHandle);return;}
    ex.qStates[idx].timeSpent++;
    const el=document.getElementById('q-timer');
    if(el){const t=ex.qStates[idx].timeSpent;el.textContent=`${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')}`;}
  },1000);
}
function pauseQTimer(){ clearInterval(_qHandle); }
function startGlobalTimer(){
  const ex=state.exam;
  clearInterval(_gHandle);
  _gHandle=setInterval(()=>{
    if(!ex||ex.submitted){clearInterval(_gHandle);return;}
    ex.globalTimeLeft=Math.max(0,ex.globalTimeLeft-1);
    const el=document.getElementById('g-timer');
    if(el){const t=ex.globalTimeLeft;el.textContent=`${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')}`;if(t<=300)el.style.color='#FF5252';}
    if(ex.globalTimeLeft===0){clearInterval(_gHandle);submitExam();}
  },1000);
}

function setupAntiCheat(){
  document.addEventListener('visibilitychange',cheatVis);
  window.addEventListener('blur',cheatBlur);
}
function cheatVis(){ if(document.hidden&&state.page==='exam') registerCheat(); }
function cheatBlur(){ if(state.page==='exam') registerCheat(); }
function registerCheat(){
  if(!state.exam||state.exam.submitted) return;
  state.exam.cheatCount++;
  state.exam.cheatPts=state.exam.cheatCount*50;
  const banner=document.getElementById('cheat-count');
  if(banner) banner.textContent=`⚠️ Tab switch ×${state.exam.cheatCount} · −${state.exam.cheatPts} rating`;
  else render();
}

function submitExam(){
  const ex=state.exam;
  if(!ex||ex.submitted) return;
  ex.submitted=true;
  clearInterval(_qHandle); clearInterval(_gHandle);
  document.removeEventListener('visibilitychange',cheatVis);
  window.removeEventListener('blur',cheatBlur);

  const qs=ex.qStates;
  const c=CONTESTS.find(x=>x.id===ex.contestId);
  const correct=qs.filter(q=>q.answered&&q.selectedOpt===q.ans).length;
  const totalPts=qs.reduce((a,q)=>a+q.pts,0);

  // Codeforces-style rating change
  const maxPts=c.qs.reduce((a,q)=>a+q.pts+(q.diff==='Hard'?300:q.diff==='Medium'?200:100),0);
  const performance=totalPts/maxPts;
  const ratingChange=Math.round((performance*400)-200)-ex.cheatPts;
  userRating=Math.max(800,userRating+ratingChange);

  const record={contestId:ex.contestId,name:c.name,correct,total:qs.length,totalPts,ratingBefore:ex.ratingBefore,ratingAfter:userRating,ratingChange,cheatCount:ex.cheatCount,qStates:[...qs]};
  contestHistory.push(record);

  updateRatingChip();
  state.analysisRecord=record;
  state.page='analysis';
  document.getElementById('page-title').textContent='Contest Analysis';
  render();
}

  state.analysisRecord=record;
  state.page='analysis';
  document.getElementById('page-title').textContent='Contest Analysis';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  render();
}

  const c=CONTESTS.find(x=>x.id===rec.contestId);

  // Topic breakdown
  const topicStats={};
  qs.forEach(q=>{
    if(!topicStats[q.topic]) topicStats[q.topic]={correct:0,wrong:0,time:0};
    if(q.answered){
      if(q.selectedOpt===q.ans) topicStats[q.topic].correct++;

  // Weak topics = wrong or unanswered
  const weakTopics=[...wrong,...unanswered].map(q=>q.topic);
  const strongTopics=correct.map(q=>q.topic);

  const ratingColor=rec.ratingChange>=0?'var(--green)':'var(--red)';

  ${rec.cheatCount>0?`<div class="card mb2" style="background:var(--orange-light);border-color:var(--orange)">

    <div style="font-size:12px;color:var(--muted);margin-top:4px">Tab switched ${rec.cheatCount} time(s) during contest. Total penalty: −${rec.cheatCount*50} rating points deducted.</div>

            <span style="font-size:13px;font-weight:500">${q.answered?(q.selectedOpt===q.ans?'✅ +'+q.pts+' pts':'❌ 0 pts'):'⏭ Skipped'}</span>
          </div>

        ${q.answered&&q.selectedOpt!==q.ans?`<div style="font-size:12px;color:var(--muted)">Correct answer: ${String.fromCharCode(65+q.ans)} · ${q.exp}</div>`:''}
      </div>`).join('')}

    <div style="flex:1;display:flex;flex-direction:column;gap:1rem">
      <!-- Difficulty performance -->
      <div class="card">
        <div class="sec">Performance by Difficulty</div>
        ${['Easy','Medium','Hard'].map(d=>{
          const s=diffStats[d];const tot=s.c+s.w;
          return `<div style="margin-bottom:10px">
            <div class="flex" style="justify-content:space-between;font-size:12px;margin-bottom:4px">
              <span class="pill-${d.toLowerCase()}">${d}</span>
              <span class="muted">${s.c}/${tot||'-'} correct</span>

    <div class="rev-card" onclick="revOpenChapter('${ch.id}')">

  const pyqs=data.pyqs||[];
  const allAnswered=pyqs.every((q,i)=>rv.answered[i]!==undefined);

  return `
  <div class="bc">
    <span onclick="revHome()">Revision</span> ›
    <span onclick="revOpenSubject('${rv.subjectId}')">${s.name}</span> ›
    <b>${ch.name}</b>

    ${data.formulas.map(f=>`<div class="formula-box">${f}</div>`).join('')}

  <!-- DERIVATIONS -->
  <div class="card mb2">

        ${answered?`<span style="font-size:12px;font-weight:500;color:${correct?'var(--green)':'var(--red)'}">${correct?'✓ Correct':'✗ Wrong'}</span>`:''}
      </div>
      <div style="font-size:14px;font-weight:500;margin-bottom:10px;line-height:1.6">${q.q}</div>

      <div class="opt ${answered?(oi===q.ans?'correct':userAns===oi?'wrong':''):''} ${answered?'answered':''}" onclick="${!answered?`revAnswer(${qi},${oi})`:''}">
        <div class="opt-lbl">${String.fromCharCode(65+oi)}</div>${o}
      </div>`).join('')}
      ${showAns?`
      <div class="pyq-ans-reveal" style="display:block">
        <div style="font-weight:500;margin-bottom:6px">🔑 Key Concepts Used:</div>
        <div style="margin-bottom:8px">${q.keys.map(k=>`<span class="key-concept">✦ ${k}</span>`).join('')}</div>

      </div>`:answered&&rv.showAnswers?'':`
      ${answered&&!rv.showAnswers?`<div style="font-size:11px;color:var(--muted);margin-top:6px;font-style:italic">Answer recorded. Reveal all answers when done with all questions.</div>`:''}
      `}
    </div>`;
  }).join('')}

  ${allAnswered?`
  <div style="text-align:center;padding:1rem">
    <button class="btn ${rv.showAnswers?'btn-sm':'btn-p'}" onclick="revToggleAnswers()">
      ${rv.showAnswers?'Hide Answers & Key Concepts':'🔓 Reveal All Answers & Key Concepts'}
    </button>
  </div>`:
  `<div class="card" style="text-align:center;background:var(--bg2);border-style:dashed">
    <div style="font-size:13px;color:var(--muted)">🔒 Answer key locked until all ${pyqs.length} questions are attempted.</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">${Object.keys(rv.answered).length}/${pyqs.length} answered</div>
  </div>`}
  `;
}

function revHome(){ state.rev={subjectId:null,chapterId:null,showAnswers:false,answered:{},allDone:false}; render(); }

            {lvl:'🧒 Super Simple','badge':'level-1','text':"A capacitor is like a tiny rechargeable bucket for electric charge. Two metal plates face each other with a gap. You push charge onto one plate; it attracts charge to the other. The bigger the plates and the smaller the gap, the more charge the bucket can hold. Filling the gap with special material (dielectric) makes the bucket hold even more."},
            {lvl:'📘 Class 12 Level','badge':'level-2','text':"Capacitance C = Q/V. For parallel plate: C = ε₀A/d. With dielectric K: C = Kε₀A/d. Energy stored: U = ½CV² = Q²/2C = ½QV. Series: 1/C = 1/C₁+1/C₂. Parallel: C = C₁+C₂. Charge remains same in series; voltage remains same in parallel."},
            {lvl:'🏆 JEE Advanced','badge':'level-3','text':"With dielectric slab of thickness t: C = ε₀A/(d−t+t/K). Force between capacitor plates: F = σ²A/2ε₀ = Q²/2ε₀A. Energy density: u = ½ε₀E². When battery connected: V constant, charge changes. When battery disconnected: Q constant, V changes. Charging/discharging: q(t) = Q(1−e^{-t/RC}) or Q·e^{-t/RC}. Time constant τ = RC."},
          ],
          questions:[
            {q:"Capacitance of a parallel plate capacitor depends on:", opts:["Charge on plates","Voltage across plates","Area and separation","Material of plates"], ans:2, exp:"C = ε₀A/d — depends on geometry and medium, not on Q or V."},
            {q:"Two capacitors C₁=2μF and C₂=3μF are in series. Equivalent capacitance is:", opts:["5 μF","1.2 μF","6 μF","0.83 μF"], ans:1, exp:"1/C = 1/2+1/3 = 5/6, so C = 6/5 = 1.2 μF."},
            {q:"Energy stored in 4μF capacitor at 100V is:", opts:["0.02 J","0.04 J","0.002 J","4×10⁻² J"], ans:0, exp:"U = ½CV² = ½×4×10⁻⁶×10⁴ = 0.02 J."},
            {q:"Inserting dielectric into charged isolated capacitor (battery disconnected):", opts:["Increases energy","Decreases energy","No change","Energy becomes zero"], ans:1, exp:"Q constant, C increases → U = Q²/2C decreases."},
            {q:"Time constant of an RC circuit with R=10kΩ and C=100μF is:", opts:["1 s","0.1 s","10 s","100 ms"], ans:0, exp:"τ = RC = 10×10³ × 100×10⁻⁶ = 1 s."},
          ]

        { id:'gauss', name:"Gauss's Law", level:'Advanced', difficulty:5,
          videoQuery:"gauss law applications JEE advanced lecture",
          explanation:[
            {lvl:'🧒 Super Simple','badge':'level-1','text':"Imagine you're inside a bubble. Gauss's law says: the total number of electric field arrows poking out of any bubble shape you draw only depends on how much total charge is trapped inside — no matter what shape the bubble is!"},
            {lvl:'📘 Class 12 Level','badge':'level-2','text':"Gauss's Law: ∮E⃗·dA⃗ = Q_enclosed/ε₀. The surface is called a Gaussian surface. Pick the surface cleverly (sphere for point charge, cylinder for line charge, pillbox for plane) to simplify integration. Only enclosed charge contributes to flux; external charges cancel out."},
            {lvl:'🏆 JEE Advanced','badge':'level-3','text':"Applications: Solid conducting sphere — all charge on surface, E=0 inside, E=kQ/r² outside. Hollow sphere — E=0 inside. Infinite line charge λ — E=λ/2πε₀r. Infinite plane σ — E=σ/2ε₀ (each side). Two parallel plates — E=σ/ε₀ between them, 0 outside. Gauss's law in dielectric: ∮D⃗·dA⃗ = Q_free, where D=ε₀E+P=εE."},
          ],
          questions:[
            {q:"Electric flux through a closed surface enclosing charge Q is:", opts:["Qε₀","Q/ε₀","kQ","Zero"], ans:1, exp:"By Gauss: Φ = Q/ε₀."},
            {q:"Electric flux due to external charges through a closed surface is:", opts:["Positive","Negative","Zero","Depends on charge"], ans:2, exp:"External charges contribute equal inward and outward flux, net = 0."},
            {q:"E inside a hollow spherical shell carrying charge Q is:", opts:["kQ/R²","kQ/r","Zero","σ/ε₀"], ans:2, exp:"No enclosed charge → E = 0 inside."},
            {q:"A Gaussian surface in the form of cube encloses dipole +q and −q. Net flux is:", opts:["q/ε₀","2q/ε₀","Zero","−q/ε₀"], ans:2, exp:"Net enclosed charge = +q−q = 0, so Φ = 0."},
            {q:"For infinite plane with surface charge σ, E just outside is:", opts:["σ/ε₀","σ/2ε₀","2σ/ε₀","σ²/ε₀"], ans:0, exp:"Using pillbox Gaussian surface: E = σ/ε₀ just outside conductor, σ/2ε₀ for infinite non-conducting sheet (each side)."},
          ]
        },
      ]},
      { id:'currentelec', name:'Current Electricity', topics:[
        {id:'ohm',name:"Ohm's Law & Resistance",level:'Mains',difficulty:2,videoQuery:"ohm's law resistance JEE class 12",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:'Think of wire as a pipe. Current is water flowing. Voltage is water pressure. Resistance is how narrow/rough the pipe is. More pressure → more flow. Narrower pipe → less flow. Ohm found: current = voltage ÷ resistance.'},{lvl:'📘 Class 12 Level',badge:'level-2',text:"V = IR (Ohm's Law). Resistance R = ρl/A where ρ is resistivity, l is length, A is cross-section. In series: R_total = R₁+R₂. In parallel: 1/R = 1/R₁+1/R₂. Temperature dependence: R = R₀(1+αT). Conductance G = 1/R."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Drift velocity: I = nAevd, so J = nevd = σE. Ohm's law: J = σE. Resistivity ρ = m/(ne²τ) where τ is relaxation time. Power: P = IV = I²R = V²/R. For non-ohmic devices, V-I curve is non-linear. Kirchhoff's laws: KCL (current), KVL (voltage). Wheatstone bridge: balanced when P/Q = R/S, null galvanometer."}],questions:[{q:"In a circuit, V=12V and R=4Ω. Current is:",opts:["3A","4A","48A","0.33A"],ans:0,exp:"I = V/R = 12/4 = 3A."},{q:"Two resistors 6Ω and 3Ω in parallel. Equivalent resistance:",opts:["9Ω","2Ω","18Ω","4.5Ω"],ans:1,exp:"1/R = 1/6+1/3 = 3/6 = 1/2, R = 2Ω."},{q:"Power dissipated in a 10Ω resistor carrying 2A:",opts:["20W","40W","5W","100W"],ans:1,exp:"P = I²R = 4×10 = 40W."},{q:"A wire of resistance R is stretched to twice its length. New resistance:",opts:["R/2","2R","4R","R"],ans:2,exp:"Volume constant → A halves when l doubles. R = ρl/A → 4R."},{q:"In a Wheatstone bridge P/Q = 2/3. For balance, R/S =",opts:["3/2","2/3","1/2","3/4"],ans:1,exp:"Balanced condition: P/Q = R/S → R/S = 2/3."}]},
        {id:'cells',name:'Cells, EMF & Internal Resistance',level:'Mains',difficulty:3,videoQuery:"emf internal resistance JEE cells problems",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:'A battery is like a water pump. EMF is the pump\'s maximum pressure. But the pump itself has some blockage inside (internal resistance). So the actual pressure reaching outside is slightly less than the maximum. The more current flows, the more pressure is lost inside.'},{lvl:'📘 Class 12 Level',badge:'level-2',text:"EMF (ε) is the work done per unit charge by the cell. Terminal voltage V = ε − Ir, where r is internal resistance and I is current. Cells in series: ε_total = Σε, r_total = Σr. Cells in parallel (identical): ε_total = ε, r_total = r/n. Max power transfer: external R = internal r."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Potentiometer: used to measure EMF without drawing current. For comparison of EMFs: ε₁/ε₂ = l₁/l₂. For internal resistance: r = R(l₁−l₂)/l₂. Charging a battery: V = ε + Ir (energy input). Discharging: V = ε − Ir. Efficiency of cell: η = P_external/P_total = R/(R+r)."}],questions:[{q:"A cell of EMF 2V and internal resistance 0.5Ω delivers current 2A. Terminal voltage is:",opts:["3V","1V","2.5V","1.5V"],ans:1,exp:"V = ε−Ir = 2−2×0.5 = 1V."},{q:"For maximum power transfer from source to load:",opts:["R_load >> r","R_load = r","R_load << r","r = 0"],ans:1,exp:"Maximum power transfer theorem: R_load = r."},{q:"n identical cells each of EMF ε in parallel have combined EMF:",opts:["nε","ε/n","ε","n²ε"],ans:2,exp:"Parallel cells: combined EMF = ε (same as single cell)."},{q:"In a potentiometer, balance length for cell A is 60 cm and cell B is 40 cm. Ratio ε_A/ε_B:",opts:["3/2","2/3","1","4/9"],ans:0,exp:"ε_A/ε_B = l_A/l_B = 60/40 = 3/2."},{q:"Internal resistance of a cell is determined using potentiometer by measuring:",opts:["EMF only","Current only","EMF and terminal voltage","Resistance directly"],ans:2,exp:"r = R(l₁−l₂)/l₂, comparing balance lengths with and without external R."}]},
      ]},
      { id:'magnetism', name:'Magnetism & Moving Charges', topics:[
        {id:'biot',name:'Biot-Savart Law',level:'Advanced',difficulty:4,videoQuery:"biot savart law JEE advanced magnetic field",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:'Moving charges create a magnetic field around them — like a spinning sprinkler creating a ring of water spray. The Biot-Savart law tells you exactly how strong that magnetic "spray" is at any point, depending on the current and how far you are.'},{lvl:'📘 Class 12 Level',badge:'level-2',text:"dB⃗ = (μ₀/4π)·(Idl⃗×r̂)/r². Direction given by right-hand rule. For a long straight wire: B = μ₀I/2πr. For circular loop at centre: B = μ₀I/2R. μ₀ = 4π×10⁻⁷ T·m/A."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"On axis of circular loop: B = μ₀IR²/2(R²+x²)^(3/2). For infinite wire: B = μ₀I/2πr. Force between parallel wires: F/l = μ₀I₁I₂/2πd (attractive if same direction, repulsive if opposite). Ampere's Law: ∮B⃗·dl⃗ = μ₀I_enc (for symmetric current distributions). Solenoid: B = μ₀nI inside. Toroid: B = μ₀nI inside, 0 outside."}],questions:[{q:"Magnetic field at centre of circular loop of radius R carrying current I:",opts:["μ₀I/4πR","μ₀I/2R","μ₀I/R","μ₀I/2πR"],ans:1,exp:"B = μ₀I/2R at centre of circular loop."},{q:"Magnetic field due to infinitely long straight wire at distance r:",opts:["μ₀I/r","μ₀I/2πr","μ₀I/4πr","μ₀I/πr"],ans:1,exp:"B = μ₀I/2πr."},{q:"Two parallel wires carry currents in same direction. They:",opts:["Repel","Attract","No force","Rotate"],ans:1,exp:"Same direction currents attract each other."},{q:"B inside an ideal solenoid of n turns/m carrying current I is:",opts:["μ₀I","μ₀nI","μ₀nI/2","2μ₀nI"],ans:1,exp:"B = μ₀nI inside a solenoid."},{q:"Force on charge q moving with velocity v in magnetic field B (perpendicular) is:",opts:["qvB","qv/B","qB/v","q/vB"],ans:0,exp:"Lorentz force F = qv×B, magnitude = qvB when perpendicular."}]},
      ]},
      { id:'optics', name:'Ray Optics', topics:[
        {id:'reflection',name:'Reflection & Mirrors',level:'Mains',difficulty:2,videoQuery:"ray optics reflection mirrors JEE class 12",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:'When light hits a mirror, it bounces back like a rubber ball. Flat mirrors show your exact mirror image. Curved mirrors (like spoons) can make images bigger (concave spoon side) or smaller (convex back side). The bending always follows a simple rule: angle in = angle out.'},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Laws of reflection: angle of incidence = angle of reflection. Mirror formula: 1/f = 1/v + 1/u. Magnification m = −v/u. For concave: f = −R/2 (f negative). For convex: f = +R/2. Sign convention: distances measured from pole, along principal axis. Concave mirror — real inverted image when object beyond F, virtual erect when inside F."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"For inclined mirrors at angle θ: number of images = 360/θ − 1. Equivalent mirrors and equivalent focal lengths for combinations. Silvered lens: P = P_lens + P_mirror + P_lens = 2P_L + P_M. Newton's formula: f² = x₁x₂ where x₁, x₂ are distances from focus. Aberrations: spherical, chromatic."}],questions:[{q:"Focal length of a concave mirror of radius 20cm is:",opts:["20cm","10cm","5cm","40cm"],ans:1,exp:"f = R/2 = 10 cm."},{q:"Object placed at centre of curvature of concave mirror forms image at:",opts:["Focus","Infinity","Same position (C)","Behind mirror"],ans:2,exp:"Object at C → image at C (real, inverted, same size)."},{q:"Magnification of concave mirror when object is inside focus:",opts:["Negative, <1","Positive, <1","Positive, >1","Negative, >1"],ans:2,exp:"Virtual erect magnified image: m is positive and >1."},{q:"A convex mirror always forms image that is:",opts:["Real, inverted","Virtual, inverted","Virtual, erect, diminished","Real, erect"],ans:2,exp:"Convex mirror always: virtual, erect, diminished regardless of object position."},{q:"Using 1/v + 1/u = 1/f. Object at u = −30cm, f = −10cm. Image at v =",opts:["−15cm","−15cm","15cm","−7.5cm"],ans:0,exp:"1/v = 1/f − 1/u = 1/(−10) − 1/(−30) = −3/30+1/30 = −2/30, v = −15cm."}]},
        {id:'refraction',name:'Refraction & Lenses',level:'Mains',difficulty:3,videoQuery:"refraction lenses JEE lens formula problems",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:'Light bends when it goes from one material into another — like a straw that looks bent in water. Lenses use this bending trick to focus light. A convex (thicker middle) lens focuses light to a point. A concave (thinner middle) lens spreads light out. Glasses use these to fix eyesight!'},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Snell's Law: n₁ sinθ₁ = n₂ sinθ₂. Lens formula: 1/f = 1/v − 1/u. Power P = 1/f (in dioptres). Lensmaker's equation: 1/f = (n−1)(1/R₁ − 1/R₂). Lenses in contact: P = P₁+P₂. Total Internal Reflection occurs when θ > θ_c = sin⁻¹(n₂/n₁)."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Refraction at spherical surface: n₂/v − n₁/u = (n₂−n₁)/R. Displacement method for convex lens: f = (D²−d²)/4D. Combination of lenses and mirrors. Prism: δ = A(n−1) for small angles. At minimum deviation: r = A/2, n = sin((A+δ_min)/2)/sin(A/2). Dispersion: ω = (n_V−n_R)/(n_Y−1) (dispersive power). Achromatic doublet condition."}],questions:[{q:"Refractive index of glass is 1.5. Critical angle for glass-air is:",opts:["30°","41.8°","45°","60°"],ans:1,exp:"θ_c = sin⁻¹(1/n) = sin⁻¹(1/1.5) = sin⁻¹(0.667) ≈ 41.8°."},{q:"Power of a concave lens of focal length 50cm is:",opts:["2D","−2D","0.5D","−0.5D"],ans:1,exp:"P = 1/f(m) = 1/(−0.5) = −2D."},{q:"A lens has focal length 20cm in air. If placed in water (n=1.33), its focal length:",opts:["Increases","Decreases","Same","Becomes zero"],ans:0,exp:"P ∝ (n_lens/n_medium − 1). In water, contrast reduces, focal length increases."},{q:"A prism of apex angle A produces minimum deviation δ. Refractive index n =",opts:["sin(A/2)/sin((A+δ)/2)","sin((A+δ)/2)/sin(A/2)","tan(A/2)","cos(A+δ)"],ans:1,exp:"n = sin((A+δ_min)/2) / sin(A/2)."},{q:"Focal length of combination of lenses f₁=10cm and f₂=−20cm in contact:",opts:["20cm","−20cm","30cm","−10cm"],ans:0,exp:"P = P₁+P₂ = 10+(-5) = 5D, f = 1/P = 20cm."}]},
      ]},
      { id:'waves', name:'Waves & Oscillations', topics:[
        {id:'shm',name:'Simple Harmonic Motion',level:'Mains',difficulty:3,videoQuery:"simple harmonic motion SHM JEE class 12",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:'SHM is like a swing. When you push a swing, it goes back and forth smoothly. The further from the middle, the stronger the pull back to centre. This happens because the restoring force is proportional to how far you are from the middle.'},{lvl:'📘 Class 12 Level',badge:'level-2',text:"SHM: a = −ω²x. x(t) = A sin(ωt+φ). ω = √(k/m) for spring. Time period T = 2π/ω = 2π√(m/k). For pendulum: T = 2π√(l/g). Velocity: v = ω√(A²−x²). Max velocity = ωA at x=0. Max acceleration = ω²A at x=±A. Energy: E = ½mω²A² (constant). KE = ½mω²(A²−x²), PE = ½mω²x²."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Superposition of SHMs: same direction → amplitude √(A₁²+A₂²+2A₁A₂cosφ). Spring combinations: series 1/k = 1/k₁+1/k₂, parallel k = k₁+k₂. Damped oscillation: x = Ae^{−γt}cos(ω't). Resonance: ω_drive = ω_natural. Coupled oscillations, normal modes. Energy decay in damped SHM. Phase space trajectories."}],questions:[{q:"In SHM, restoring force is:",opts:["Constant","∝ displacement","∝ velocity","∝ acceleration²"],ans:1,exp:"F = −kx, force proportional to displacement from equilibrium."},{q:"Time period of simple pendulum of length l on moon (g_moon = g/6):",opts:["T","T√6","T/√6","6T"],ans:1,exp:"T ∝ √(1/g). On moon g → g/6, so T → T√6."},{q:"In SHM, KE equals PE at displacement x = :",opts:["A","A/√2","A/2","0"],ans:1,exp:"KE = PE when ½mω²(A²−x²) = ½mω²x², so A²=2x², x = A/√2."},{q:"A particle in SHM has velocity 4m/s at x=3m and velocity 3m/s at x=4m. Amplitude is:",opts:["5m","25m","√7m","7m"],ans:0,exp:"v² = ω²(A²−x²). 16=ω²(A²−9), 9=ω²(A²−16). Subtracting: 7=7ω², ω=1, A²=25, A=5m."},{q:"Angular frequency of spring-mass system with k=100N/m, m=0.25kg is:",opts:["5 rad/s","10 rad/s","20 rad/s","400 rad/s"],ans:2,exp:"ω = √(k/m) = √(100/0.25) = √400 = 20 rad/s."}]},
      ]},

  chemistry: {

    chapters:[
      { id:'atomicstruct', name:'Atomic Structure', topics:[
        {id:'bohr',name:'Bohr Model of Atom',level:'Mains',difficulty:2,videoQuery:"bohr model atomic structure JEE class 12",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"Imagine the atom like a tiny solar system. The nucleus (sun) is in the middle with protons and neutrons. Electrons (planets) orbit around it in fixed circular paths. They can only exist at certain allowed orbits — not anywhere in between. When electrons jump between orbits, they absorb or emit light."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Bohr's postulates: Electrons move in circular orbits. Allowed orbits: mvr = nh/2π. Energy of nth orbit: Eₙ = −13.6/n² eV. Radius: rₙ = 0.529n² Å. Frequency of emitted photon: ν = (E₂−E₁)/h. Spectral series: Lyman (UV), Balmer (visible), Paschen (IR), etc."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Wave-particle duality: de Broglie λ = h/mv. Heisenberg uncertainty: Δx·Δp ≥ h/4π. Quantum numbers: n (principal), l (azimuthal, 0 to n−1), mₗ (magnetic, −l to +l), ms (spin, ±½). Orbital shapes: s (sphere), p (dumbbell), d (complex). Aufbau, Hund's rule, Pauli exclusion. Electronic configurations including exceptions (Cr, Cu)."}],questions:[{q:"Energy of electron in 2nd orbit of hydrogen:",opts:["−13.6 eV","−3.4 eV","−1.51 eV","−0.85 eV"],ans:1,exp:"E = −13.6/n² = −13.6/4 = −3.4 eV."},{q:"Radius of 3rd orbit of hydrogen atom (r₁ = 0.529Å):",opts:["0.529 Å","1.587 Å","4.761 Å","9 Å"],ans:2,exp:"r = 0.529×n² = 0.529×9 = 4.761 Å."},{q:"Spectral series lying in visible region:",opts:["Lyman","Balmer","Paschen","Brackett"],ans:1,exp:"Balmer series (n=3,4,5... to n=2) lies in visible light."},{q:"Maximum electrons in 3rd shell (n=3):",opts:["8","18","32","6"],ans:1,exp:"Max electrons = 2n² = 2×9 = 18."},{q:"Quantum number that describes shape of orbital:",opts:["n","l","mₗ","ms"],ans:1,exp:"Azimuthal quantum number l determines orbital shape: 0=s, 1=p, 2=d, 3=f."}]},
        {id:'periodictable',name:'Periodic Table & Trends',level:'Mains',difficulty:2,videoQuery:"periodic trends ionization energy JEE chemistry",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"The periodic table is like a well-organized city map of all elements. Elements in the same column (group) behave similarly — like neighbours with the same habits. As you go across a row (period), atoms get smaller even though they gain more electrons, because more protons pull everything tighter."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Atomic radius: increases down group, decreases across period. Ionic radius: cations smaller, anions larger than parent atom. Ionisation energy (IE): increases across period, decreases down group. Exceptions: IE of O < N (half-filled stability), IE of Mg > Al. Electron affinity: more negative across period. Electronegativity: Pauling scale, F highest, increases across and up."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Shielding effect causes irregular trends. Noble gas configuration causes high IE jumps. d-block contraction: 3d elements have similar radius to 4d due to poor d-shielding. Lanthanide contraction: similar radii in 5d elements. Diagonal relationships (Li-Mg, Be-Al, B-Si). Anomalous properties of first element in each group."}],questions:[{q:"Correct order of ionization energy:",opts:["Li<B<Be","Be<B<Li","Li<Be<B","B<Be<Li"],ans:0,exp:"Li<B<Be: Be has stable full 2s, so IE(Be) > IE(B)."},{q:"Smallest ion among:",opts:["Na⁺","Mg²⁺","Al³⁺","Si⁴⁺"],ans:3,exp:"Same period: more charge on isoelectronic ion → smaller size. Si⁴⁺ has most protons (14) for same 10 electrons."},{q:"Which has highest electronegativity?",opts:["F","O","Cl","N"],ans:0,exp:"Fluorine has highest electronegativity (4.0 on Pauling scale)."},{q:"Electron affinity of noble gases is:",opts:["Very high","Zero or positive (endothermic)","Negative","Equal to halogens"],ans:1,exp:"Noble gases have complete shells, adding electron is endothermic (positive EA or zero)."},{q:"Across a period, atomic radius generally:",opts:["Increases","Decreases","Stays same","First increases then decreases"],ans:1,exp:"More protons across period pull electrons closer, reducing radius."}]},
      ]},
      { id:'chemicalbonding', name:'Chemical Bonding', topics:[
        {id:'vsepr',name:'VSEPR & Molecular Geometry',level:'Mains',difficulty:3,videoQuery:"VSEPR theory molecular geometry JEE chemistry",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"VSEPR says electron pairs around an atom are like grumpy neighbours — they push away from each other as much as possible. By knowing how many pairs (bonding + lone pairs) are around the central atom, you can predict the 3D shape of any molecule!"},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Count bonding pairs (BP) + lone pairs (LP) around central atom. 2 pairs: linear (180°). 3 BP: trigonal planar (120°). 4 BP: tetrahedral (109.5°). With lone pairs: 3BP+1LP = pyramidal, 2BP+2LP = bent. Lone pairs repel more than bonding pairs, compressing bond angles. Examples: H₂O bent (104.5°), NH₃ pyramidal (107°), CH₄ tetrahedral (109.5°)."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Hybridisation: sp (linear, 180°), sp² (trigonal, 120°), sp³ (tetrahedral, 109.5°), sp³d (trigonal bipyramidal), sp³d² (octahedral). Resonance structures and resonance energy. MO theory: σ and π bonds, bond order = (bonding−antibonding)/2. O₂ is paramagnetic (2 unpaired in MO). Formal charge = V − N − B/2."}],questions:[{q:"Shape of BF₃ molecule:",opts:["Bent","Trigonal planar","Pyramidal","Linear"],ans:1,exp:"B has 3 bond pairs, 0 lone pairs → trigonal planar."},{q:"Bond angle in H₂O is 104.5° (less than 109.5°) because:",opts:["O is large","2 lone pairs repel bonding pairs","Ionic bonding","H is small"],ans:1,exp:"Two lone pairs exert more repulsion, compressing H-O-H angle below tetrahedral."},{q:"Hybridisation of N in NH₃:",opts:["sp","sp²","sp³","sp³d"],ans:2,exp:"N in NH₃: 3 bonds + 1 lone pair = 4 pairs → sp³ hybridisation."},{q:"Bond order of O₂ by MO theory:",opts:["1","1.5","2","2.5"],ans:2,exp:"O₂ MO: bonding=8, antibonding=4, BO = (8-4)/2 = 2."},{q:"Which molecule is linear?",opts:["H₂O","NH₃","CO₂","SO₂"],ans:2,exp:"CO₂: O=C=O, 2 double bonds, no lone pairs on C → linear (sp)."}]},
      ]},
      { id:'thermo', name:'Thermodynamics', topics:[
        {id:'firstlaw',name:'First Law & Internal Energy',level:'Mains',difficulty:3,videoQuery:"first law thermodynamics JEE chemistry internal energy",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"Energy can't be created or destroyed — only moved around. If you heat something (give it energy) or do work on it, its internal energy goes up. The first law keeps the energy accounts balanced: energy in = energy out + energy stored."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"First law: ΔU = q + w. q = heat absorbed by system, w = work done on system. For expansion: w = −PΔV. Enthalpy H = U + PV. At constant P: ΔH = qₚ = ΔU + PΔV = ΔU + Δn_g·RT. Hess's law: ΔH is path-independent. Bond enthalpy: ΔH = Σ(bonds broken) − Σ(bonds formed)."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"For reversible isothermal expansion: w = −nRT ln(V₂/V₁). For irreversible: w = −P_ext·ΔV. Adiabatic: q=0, TV^{γ−1} = const, PV^γ = const. Kirchhoff's law: d(ΔH)/dT = ΔCₚ. Entropy S: ΔS = q_rev/T. Gibbs energy: G = H − TS, ΔG = ΔH − TΔS. Spontaneous if ΔG < 0. ΔG = ΔG° + RT lnQ, at equilibrium ΔG = 0, ΔG° = −RT lnK."}],questions:[{q:"At constant pressure, heat change equals:",opts:["ΔU","ΔH","ΔG","ΔS"],ans:1,exp:"qₚ = ΔH (enthalpy change at constant pressure)."},{q:"Work done in free expansion of gas:",opts:["Maximum","Minimum","Zero","nRT"],ans:2,exp:"Free expansion: P_ext = 0, so w = −P_ext ΔV = 0."},{q:"Hess's law is based on:",opts:["First law","Conservation of energy and path independence of ΔH","Second law","Avogadro's law"],ans:1,exp:"Hess's law: ΔH is a state function, independent of path."},{q:"A reaction is spontaneous at all temperatures when:",opts:["ΔH>0, ΔS>0","ΔH<0, ΔS>0","ΔH<0, ΔS<0","ΔH>0, ΔS<0"],ans:1,exp:"ΔG = ΔH − TΔS < 0 always when ΔH<0 and ΔS>0."},{q:"For a reaction, ΔH = −200 kJ and ΔS = −0.5 kJ/K. It is spontaneous below T =",opts:["400K","200K","100K","500K"],ans:0,exp:"ΔG = ΔH − TΔS = 0 at T = ΔH/ΔS = 200/0.5 = 400K. Spontaneous (ΔG<0) below 400K."}]},
      ]},
      { id:'equilibrium', name:'Chemical Equilibrium', topics:[
        {id:'lechat',name:"Le Chatelier's Principle",level:'Mains',difficulty:3,videoQuery:"le chatelier's principle JEE equilibrium short lecture",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"Imagine a seesaw perfectly balanced. If you push one side down, it adjusts to find balance again. Chemical reactions work similarly: if you disturb equilibrium (add reactant, change temperature, change pressure), the reaction shifts in a direction to undo that disturbance."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Le Chatelier's Principle: On disturbing equilibrium, system shifts to oppose the change. Adding reactant → forward shift. Removing product → forward shift. Increasing P → shift to side with fewer moles of gas. Increasing T → shift to endothermic side. Catalyst: reaches equilibrium faster, doesn't shift it."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"K_c = [products]/[reactants] (molar). K_p = K_c(RT)^{Δn}. For Δn=0: K_p = K_c. Relation: ΔG° = −RT lnK. Van't Hoff equation: d(lnK)/dT = ΔH/RT². Degree of dissociation α related to Kc. Buffer solutions: pH = pKa + log([A⁻]/[HA]). Common ion effect. Solubility product Ksp and ionic product Q."}],questions:[{q:"On increasing pressure, N₂+3H₂⇌2NH₃ equilibrium shifts:",opts:["Backward","Forward","No change","Depends on temperature"],ans:1,exp:"Δn = 2−4 = −2 (fewer moles on right). Increasing P → forward shift."},{q:"A catalyst affects equilibrium by:",opts:["Shifting it forward","Changing K value","Reaching equilibrium faster","Shifting it backward"],ans:2,exp:"Catalyst increases rate of both forward and backward equally, reaching equilibrium faster without shifting it."},{q:"Kp = Kc when:",opts:["Δn=1","Δn=−1","Δn=0","Always"],ans:2,exp:"K_p = K_c(RT)^Δn. When Δn=0: K_p = K_c."},{q:"For reaction with ΔH < 0 (exothermic), increasing temperature:",opts:["Increases K","Decreases K","No effect on K","Doubles K"],ans:1,exp:"Van't Hoff: d(lnK)/dT = ΔH/RT². Exothermic ΔH<0 → K decreases with T."},{q:"pH of buffer containing 0.1M acetic acid and 0.1M sodium acetate (pKa=4.74):",opts:["4.74","7","3.74","5.74"],ans:0,exp:"Henderson-Hasselbalch: pH = pKa + log(0.1/0.1) = 4.74 + 0 = 4.74."}]},
      ]},
      { id:'organic', name:'Organic Chemistry', topics:[
        {id:'iupac',name:'IUPAC Naming & Isomerism',level:'Mains',difficulty:3,videoQuery:"IUPAC nomenclature isomerism JEE organic chemistry",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"IUPAC naming is like giving molecules a proper address. The longest carbon chain is the 'street name', branches are 'house numbers' (counted to give lowest numbers). Isomers are molecules with the same formula but different arrangements — like the same LEGOs built into different shapes."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Parent chain: longest continuous C chain. Suffix: -ane(alkane), -ene(alkene), -yne(alkyne), -ol(alcohol), -al(aldehyde), -one(ketone), -oic acid. Number from end nearest to substituent. Structural isomers: chain, position, functional group. Stereoisomers: geometric (cis-trans), optical (R/S enantiomers). E/Z nomenclature."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Conformational isomers: Newman projections, eclipsed vs staggered. Ring strain: Baeyer strain theory. Chirality: chiral centre, optical activity, specific rotation [α]. Diastereomers vs enantiomers. Meso compounds. R/S assignment: CIP priority rules. Optical purity (ee%) = (major−minor)/(major+minor) × 100%."}],questions:[{q:"IUPAC name of CH₃-CH(CH₃)-CH₂-CH₃:",opts:["2-methylbutane","3-methylbutane","2-methylpropane","Isopentane"],ans:0,exp:"Longest chain = 4 carbons (butane). Methyl group at C2 → 2-methylbutane."},{q:"Number of structural isomers of C₄H₁₀:",opts:["2","3","4","5"],ans:0,exp:"C₄H₁₀: n-butane and 2-methylpropane (isobutane) = 2 isomers."},{q:"Cis-trans isomerism requires:",opts:["Chiral centre","Double bond with two different groups on each C","Sp3 carbon","Ionic bond"],ans:1,exp:"Need restricted rotation (C=C or ring) and two different groups on each doubly-bonded C."},{q:"A molecule with one chiral centre has how many optical isomers:",opts:["1","2","4","0"],ans:1,exp:"1 chiral centre → 2¹ = 2 optical isomers (enantiomers)."},{q:"Meso compound is:",opts:["Optically active","Optically inactive despite chiral centres","An enantiomer","A diastereomer with optical activity"],ans:1,exp:"Meso compound has chiral centres but internal plane of symmetry makes it optically inactive."}]},
      ]},
    ]
  },
  mathematics: {
    name:'Mathematics', icon:'📐', color:'#FAEEDA', textColor:'#633806',
    chapters:[
      { id:'calculus', name:'Differential Calculus', topics:[
        {id:'limits',name:'Limits & Continuity',level:'Mains',difficulty:3,videoQuery:"limits continuity JEE mains calculus short lecture",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"A limit is asking: what value does a function approach as you zoom in really close to a point, without actually touching it? Continuity means the graph has no breaks or jumps — you can draw it without lifting your pencil. Most natural functions are continuous except at points of 'trouble'."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"lim(x→a) f(x) = L means f approaches L as x approaches a. Standard limits: lim(x→0) sinx/x = 1, lim(x→0) (1+x)^{1/x} = e, lim(x→0) (aˣ−1)/x = lna. L'Hôpital's rule for 0/0 or ∞/∞ forms. Continuity at a: f(a) exists, limit exists, and they're equal. Types of discontinuity: removable, jump, infinite."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Sandwich theorem. Limit of sequence. Asymptotic expansions: sinx ≈ x − x³/6, eˣ ≈ 1+x+x²/2+... Intermediate Value Theorem (IVT): continuous f on [a,b], c between f(a) and f(b) → ∃ x in (a,b) with f(x)=c. Epsilon-delta definition. Continuity of composed functions. Greatest integer function, signum function analysis."}],questions:[{q:"lim(x→0) sin(3x)/x equals:",opts:["1","3","0","∞"],ans:1,exp:"lim sin(ax)/x = a. Here a=3, so limit = 3."},{q:"lim(x→∞) (1 + 2/x)^x equals:",opts:["e","e²","2e","∞"],ans:1,exp:"(1+k/x)^x → e^k as x→∞. Here k=2, limit = e²."},{q:"f(x) = (x²−4)/(x−2) at x=2 is:",opts:["Continuous","Discontinuous, removable","Discontinuous, jump","Discontinuous, infinite"],ans:1,exp:"f(2) is undefined, but lim(x→2) = 4 exists. Removable discontinuity."},{q:"L'Hôpital's rule applies to which form:",opts:["0/∞","∞/0","0/0","0·∞ directly"],ans:2,exp:"L'Hôpital applies to 0/0 or ∞/∞ indeterminate forms."},{q:"lim(x→0) (eˣ−1−x)/x² equals:",opts:["0","1","1/2","∞"],ans:2,exp:"Using Taylor: eˣ = 1+x+x²/2+... so (eˣ−1−x)/x² → x²/2·1/x² = 1/2."}]},
        {id:'differentiation',name:'Differentiation & Applications',level:'Mains',difficulty:3,videoQuery:"differentiation applications maxima minima JEE",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"Differentiation finds the slope of a curve at any point — like measuring how steep a hill is right where you're standing. If slope = 0, you're at a peak (maximum) or valley (minimum). This is how engineers find the best design, and how rockets calculate the optimal launch angle."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"d/dx(xⁿ) = nxⁿ⁻¹. Chain rule: dy/dx = (dy/du)·(du/dx). Product rule: (uv)' = u'v + uv'. Quotient rule: (u/v)' = (u'v − uv')/v². Implicit differentiation. Rolle's theorem: f continuous on [a,b], differentiable on (a,b), f(a)=f(b) → ∃c: f'(c)=0. LMVT: f'(c) = (f(b)−f(a))/(b−a)."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Higher derivatives. Leibniz theorem: nth derivative of product. Parametric differentiation: dy/dx = (dy/dt)/(dx/dt). d²y/dx² in parametric form. Taylor's expansion. Curve sketching: domain, range, symmetry, asymptotes, monotonicity, inflection points. Maxima/minima: first and second derivative tests. Optimisation problems. Rate of change, related rates."}],questions:[{q:"Derivative of sin(x²):",opts:["cos(x²)","2x·cos(x²)","−cos(x²)","x·cos(x²)"],ans:1,exp:"Chain rule: d/dx sin(u) = cos(u)·du/dx, u=x² → 2x·cos(x²)."},{q:"f(x) = x³−3x has local minima at:",opts:["x=1","x=−1","x=0","x=3"],ans:0,exp:"f'(x) = 3x²−3 = 0 → x=±1. f''(x)=6x: f''(1)=6>0 → local minima at x=1."},{q:"If y = eˣ·sin(x), dy/dx at x=0 is:",opts:["0","1","2","e"],ans:1,exp:"y' = eˣ(sin x + cos x). At x=0: y' = 1·(0+1) = 1."},{q:"Rolle's theorem cannot be applied to f(x)=|x| on [−1,1] because:",opts:["f(−1)≠f(1)","Not differentiable at x=0","Not continuous","f is even"],ans:1,exp:"|x| is not differentiable at x=0 — Rolle's condition violated."},{q:"Rate of change of area of circle when radius is 5cm and dr/dt = 2 cm/s:",opts:["10π","20π","5π","100π"],ans:1,exp:"A = πr². dA/dt = 2πr·dr/dt = 2π×5×2 = 20π cm²/s."}]},
      ]},
      { id:'integral', name:'Integral Calculus', topics:[
        {id:'integration',name:'Integration Techniques',level:'Mains',difficulty:4,videoQuery:"integration techniques JEE mains by parts substitution",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"Integration is the reverse of differentiation — if differentiation tells you the slope at each point, integration adds up all those tiny slopes to find the total area under a curve. Think of it as finding total distance from speed, or total volume from cross-sectional areas."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"∫xⁿdx = xⁿ⁺¹/(n+1). ∫sin x dx = −cos x. ∫eˣdx = eˣ. Substitution: replace variable to simplify. By parts: ∫u dv = uv − ∫v du (ILATE: Inverse, Log, Algebraic, Trig, Exponential). Partial fractions for rational functions. Definite integral: ∫ₐᵇ f(x)dx = F(b)−F(a). Properties: ∫ₐᵇ = −∫ᵦₐ, ∫ₐᵃ = 0."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"King's property: ∫₀ᵃ f(x)dx = ∫₀ᵃ f(a−x)dx. Walli's formula for ∫₀^{π/2} sinⁿx dx. Reduction formulas. Leibniz rule: d/dx ∫_{g(x)}^{h(x)} f(t)dt = f(h)h' − f(g)g'. Area under curve (definite integrals). Length of arc, volume of revolution. Gamma function."}],questions:[{q:"∫2x eˣ² dx equals:",opts:["2eˣ²+C","eˣ²+C","x²eˣ²+C","eˣ²/2+C"],ans:1,exp:"Let u=x², du=2x dx. ∫eᵘ du = eᵘ+C = eˣ²+C."},{q:"∫₀^π sin x dx equals:",opts:["0","2","1","π"],ans:1,exp:"[−cos x]₀^π = −cos π − (−cos 0) = 1+1 = 2."},{q:"∫x·eˣ dx using integration by parts:",opts:["xeˣ+C","eˣ(x−1)+C","eˣ(x+1)+C","x²eˣ/2+C"],ans:1,exp:"ILATE: u=x, dv=eˣdx. uv−∫v du = xeˣ−∫eˣdx = xeˣ−eˣ = eˣ(x−1)+C."},{q:"∫₀ᵃ f(x)dx = ∫₀ᵃ f(a−x)dx is called:",opts:["Walli's formula","King's property","Reduction formula","Leibniz rule"],ans:1,exp:"This is the King's property of definite integrals."},{q:"Area bounded by y=x², x-axis, x=0 and x=3 is:",opts:["9","27","9/3","3"],ans:0,exp:"∫₀³ x² dx = [x³/3]₀³ = 27/3 = 9 sq. units."}]},
      ]},
      { id:'algebra', name:'Algebra & Matrices', topics:[
        {id:'complexnum',name:'Complex Numbers',level:'Mains',difficulty:3,videoQuery:"complex numbers JEE mains class 12 algebra",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"Real numbers can't explain √(−1) — so mathematicians invented i = √(−1) and called it imaginary! But it's very real in engineering and physics. Every complex number z = a + bi has a 'real part' a and 'imaginary part' b. On an Argand diagram, they live on a 2D plane, not just a number line."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"z = a+bi. |z| = √(a²+b²) (modulus). arg(z) = tan⁻¹(b/a). Polar form: z = r(cosθ+isinθ) = re^{iθ}. Conjugate z̄ = a−bi. z·z̄ = |z|². De Moivre's theorem: (cosθ+isinθ)ⁿ = cos(nθ)+isin(nθ). Cube roots of unity: 1, ω, ω² where ω = e^{2πi/3}."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Rotation in complex plane: z₂ = z₁·e^{iθ}. Locus problems in complex plane. Triangle inequality: |z₁+z₂| ≤ |z₁|+|z₂|. Equation of circle: |z−z₀| = r. Argument properties. nth roots of unity form regular polygon. Sum = 0, product = (−1)^{n+1}. Geometrical interpretations of complex operations."}],questions:[{q:"i⁴⁷ equals:",opts:["i","−i","1","−1"],ans:1,exp:"i⁴=1, 47=44+3, so i⁴⁷ = (i⁴)¹¹·i³ = 1·(−i) = −i."},{q:"|3+4i| equals:",opts:["7","5","1","12"],ans:1,exp:"|3+4i| = √(9+16) = √25 = 5."},{q:"If ω is cube root of unity, 1+ω+ω² =",opts:["0","1","3","ω"],ans:0,exp:"Sum of cube roots of unity = 0."},{q:"Polar form of z = 1+i:",opts:["√2 e^{iπ/4}","e^{iπ/4}","√2 e^{iπ/3}","2e^{iπ/4}"],ans:0,exp:"|z|=√2, arg = π/4. z = √2 e^{iπ/4}."},{q:"Argument of z = (1−i)/(1+i):",opts:["π/4","−π/2","π/2","−π/4"],ans:1,exp:"(1−i)/(1+i) = (1−i)²/2 = −i. arg(−i) = −π/2."}]},
        {id:'matrices',name:'Matrices & Determinants',level:'Mains',difficulty:3,videoQuery:"matrices determinants JEE mains class 12",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"A matrix is just a rectangular grid of numbers — like a spreadsheet. They help us solve many simultaneous equations at once. Determinants are like a special number you calculate from a square matrix that tells you if the equations have a unique solution or not (zero det = no unique solution)."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Matrix operations: addition (same size), multiplication (rows×columns). Transpose A^T: rows become columns. Determinant |A| for 2×2: ad−bc. For 3×3: cofactor expansion. A·A⁻¹ = I. A⁻¹ = adj(A)/|A|. Cramer's rule. Rank of matrix. Singular matrix: |A|=0."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Properties of determinants: row/column operations don't change value (with sign). Eigenvalues λ: det(A−λI)=0. Cayley-Hamilton theorem: matrix satisfies its own characteristic equation. System AX=B: unique solution if |A|≠0, infinite if |A|=0 and consistent, no solution if inconsistent. Normal form, echelon form. Linear transformations."}],questions:[{q:"If A is a 2×3 matrix and B is 3×4, order of AB is:",opts:["2×4","3×3","4×2","2×3"],ans:0,exp:"(m×n)(n×p) = m×p. So (2×3)(3×4) = 2×4."},{q:"Determinant of identity matrix I₃ is:",opts:["0","1","3","−1"],ans:1,exp:"det(I) = 1 for any size identity matrix."},{q:"If |A| = 0, matrix A is called:",opts:["Orthogonal","Singular","Invertible","Symmetric"],ans:1,exp:"Singular matrix has determinant = 0 (no inverse)."},{q:"For a 3×3 matrix, det(2A) =",opts:["2|A|","4|A|","6|A|","8|A|"],ans:3,exp:"det(kA) = k^n · det(A) for n×n matrix. det(2A) = 2³|A| = 8|A|."},{q:"If A is symmetric, Aᵀ equals:",opts:["−A","A","A⁻¹","I"],ans:1,exp:"By definition of symmetric matrix: Aᵀ = A."}]},
      ]},
      { id:'coordinate', name:'Coordinate Geometry', topics:[
        {id:'conics',name:'Circles & Conics',level:'Mains',difficulty:4,videoQuery:"circles conics JEE mains coordinate geometry",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"Conics are shapes made by slicing a cone at different angles. Slice straight across → circle. Tilt the cut → ellipse. Cut parallel to the side → parabola. Cut steeply → hyperbola. All these curves appear naturally — planets move in ellipses, satellite dishes are parabolas, cooling towers are hyperbolas!"},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Circle: (x−h)²+(y−k)²=r². Parabola: y²=4ax (focus (a,0), directrix x=−a). Ellipse: x²/a²+y²/b²=1, a>b, foci at (±c,0), c²=a²−b². Eccentricity e=c/a. Hyperbola: x²/a²−y²/b²=1, foci (±c,0), c²=a²+b², e>1. Tangent conditions. Normal equations."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Parametric forms: circle (cosθ, sinθ), ellipse (a cosθ, b sinθ), parabola (at², 2at). Chord of contact: T=0. Pair of tangents: SS₁=T². Director circle. Auxiliary circle. Hyperbola: rectangular (xy=c²). Asymptotes. Reflection property: ray from focus reflects through other focus. Polar equation. Family of curves."}],questions:[{q:"Eccentricity of a circle is:",opts:["0","1","0.5",">1"],ans:0,exp:"For a circle, all points equidistant from centre, e = 0."},{q:"Focus of parabola y²=8x is at:",opts:["(2,0)","(0,2)","(8,0)","(−2,0)"],ans:0,exp:"y²=4ax, 4a=8, a=2. Focus at (a,0) = (2,0)."},{q:"For ellipse x²/25+y²/16=1, length of major axis:",opts:["5","10","8","25"],ans:1,exp:"a²=25, a=5. Major axis = 2a = 10."},{q:"For hyperbola x²/9−y²/16=1, eccentricity is:",opts:["5/3","4/3","3/5","√(25/9)"],ans:0,exp:"c²=a²+b²=9+16=25, c=5. e = c/a = 5/3."},{q:"Tangent to y²=4ax at point (at²,2at) is:",opts:["ty = x+at²","ty=x−at²","y=tx+a/t","tx+y=2at+at³"],ans:0,exp:"Tangent at (at²,2at) to y²=4ax is: ty = x + at²."}]},
      ]},

  biology: {
    name:'Biology', icon:'🧬', color:'#FAECE7', textColor:'#712B13',
    chapters:[
      { id:'cellbiology', name:'Cell Biology', topics:[
        {id:'organelles',name:'Cell Organelles & Functions',level:'Mains',difficulty:2,videoQuery:"cell organelles functions NEET biology class 11",explanation:[{lvl:'🧒 Super Simple',badge:'level-1',text:"A cell is like a tiny city! The nucleus is City Hall (controls everything). Mitochondria are the power plants (make energy). The cell membrane is the city wall (controls entry/exit). Ribosomes are factories (make proteins). Golgi apparatus is the post office (packages and ships goods)."},{lvl:'📘 Class 12 Level',badge:'level-2',text:"Prokaryotic vs eukaryotic. Nucleus: contains DNA, bounded by nuclear envelope with pores. Mitochondria: double membrane, cristae, site of cellular respiration. Chloroplast: photosynthesis, grana and stroma. ER: rough (ribosomes, protein synthesis), smooth (lipid synthesis). Golgi: secretion, modification. Lysosome: intracellular digestion. Ribosome: 70S (prokaryote), 80S (eukaryote)."},{lvl:'🏆 JEE Advanced',badge:'level-3',text:"Fluid mosaic model (Singer-Nicolson): lipid bilayer with embedded proteins. Membrane transport: passive (diffusion, osmosis, facilitated), active (needs ATP). Endosymbiont theory for mitochondria and chloroplasts. Cell cycle: G1, S (DNA replication), G2, M (mitosis). Checkpoints. Apoptosis. Cyclin-CDK complexes. Mitosis vs meiosis (crossing over, genetic diversity, stages)."}],questions:[{q:"Site of cellular respiration in eukaryotic cell:",opts:["Nucleus","Ribosome","Mitochondria","Chloroplast"],ans:2,exp:"Mitochondria — site of aerobic respiration (Krebs cycle + ETC)."},{q:"Ribosome size in prokaryotes:",opts:["80S","70S","60S","40S"],ans:1,exp:"Prokaryotes: 70S ribosomes (50S + 30S subunits)."},{q:"Powerhouse of the cell is:",opts:["Nucleus","Golgi","Lysosome","Mitochondria"],ans:3,exp:"Mitochondria produce ATP via cellular respiration — 'powerhouse'."},{q:"Which organelle is called 'suicidal bag'?",opts:["Mitochondria","Ribosome","Lysosome","Golgi"],ans:2,exp:"Lysosome: contains digestive enzymes, can lyse the cell if ruptured."},{q:"DNA replication occurs in which phase of cell cycle:",opts:["G1","S phase","G2","M phase"],ans:1,exp:"S (Synthesis) phase: DNA is replicated before mitosis."}]},
      ]},

ON, no markdown fences, no commentary before or after, in exactly this shape: {\\\"question_type\\\":\\\"numerical\\\"|\\\"theoretical\\\",\\\"topic\\\":\\\"short topic name\\\",\\\"final_answer\\\":\\\"the exact final answer with correct units for numerical questions, OR a precise one-line key-insight summary for theoretical questions\\\",\\\"steps\\\":[{\\\"title\\\":\\\"Step 1: ...\\\",\\\"content\\\":\\\"...\\\"},{\\\"title\\\":\\\"Step 2: ...\\\",\\\"content\\\":\\\"...\\\"}]}. Keep each step concise but exact — 1 to 5 sentences, including any key formula, derivation line, or calculation. Never include anything outside the JSON object. Accuracy is the absolute highest priority: if unsure of any numeric result, recompute it carefully rather than presenting an uncertain figure.";

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
